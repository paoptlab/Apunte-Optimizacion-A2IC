# Compila los documentos LaTeX y guarda los PDFs en main.
# Evita bucles: ignora cambios solo de PDF y marca el commit con [skip ci].
name: Build LaTeX PDFs

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.pdf"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-pdfs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          # Necesario para poder empujar el commit de PDFs a main.
          fetch-depth: 0

      - name: Compile LaTeX documents
        id: latex
        continue-on-error: true
        uses: xu-cheng/latex-action@v4
        with:
          # Fuentes en Latex/; los PDFs se copian después a las carpetas finales.
          root_file: |
            Apunte/Latex/main.tex
            Auxiliar/Latex-Enunciado/main.tex
            Auxiliar/Latex-Pauta/main.tex
            RP-Modelamiento/Latex/main.tex
            RP-Modelos-Avanzados/Latex/main.tex
          work_in_root_file_dir: true
          continue_on_error: true

      - name: Place PDFs in final folders
        id: place
        run: |
          set -euo pipefail

          missing=0
          copied=0

          place_pdf() {
            local src="$1"
            local dst="$2"
            if [[ -f "${src}" ]]; then
              mkdir -p "$(dirname "${dst}")"
              cp "${src}" "${dst}"
              local size
              size="$(wc -c < "${dst}" | tr -d ' ')"
              echo "OK  ${src} -> ${dst} (${size} bytes)"
              copied=$((copied + 1))
            else
              echo "::error file=${src}::Fallo la generación de ${src} (destino esperado: ${dst})"
              missing=1
            fi
          }

          place_pdf "Apunte/Latex/main.pdf" "Apunte/main.pdf"
          place_pdf "Auxiliar/Latex-Enunciado/main.pdf" "Auxiliar/Enunciado.pdf"
          place_pdf "Auxiliar/Latex-Pauta/main.pdf" "Auxiliar/Pauta.pdf"
          place_pdf "RP-Modelamiento/Latex/main.pdf" "RP-Modelamiento/main.pdf"
          place_pdf "RP-Modelos-Avanzados/Latex/main.pdf" "RP-Modelos-Avanzados/main.pdf"

          echo "copied=${copied}" >> "${GITHUB_OUTPUT}"
          echo "missing=${missing}" >> "${GITHUB_OUTPUT}"

          if [[ "${missing}" -ne 0 ]]; then
            echo "Uno o más PDFs no se generaron."
            exit 1
          fi

      - name: Commit and push PDFs to main
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            Apunte/main.pdf \
            Auxiliar/Enunciado.pdf \
            Auxiliar/Pauta.pdf \
            RP-Modelamiento/main.pdf \
            RP-Modelos-Avanzados/main.pdf

          if git diff --cached --quiet; then
            echo "No hay cambios en los PDFs; nada que publicar."
            exit 0
          fi

          git commit -m "docs: update compiled LaTeX PDFs [skip ci]"
          git push origin HEAD:main
