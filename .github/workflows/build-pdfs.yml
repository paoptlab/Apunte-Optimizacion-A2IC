# Compila los documentos LaTeX principales y publica solo los PDFs en la rama
# pdf-output. Se dispara en push a main (no a pdf-output) para evitar bucles.
name: Build LaTeX PDFs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-pdfs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile LaTeX documents
        id: latex
        # Permite llegar al paso de verificación aunque latex-action falle.
        continue-on-error: true
        uses: xu-cheng/latex-action@v4
        with:
          # Documentos principales (contienen \documentclass). Cada uno vive en
          # su propio directorio; work_in_root_file_dir respeta rutas relativas
          # (\input, \graphicspath, ../../Apunte/..., img/, etc.).
          root_file: |
            Apunte/Latex/main.tex
            Auxiliar/Latex-Enunciado/main.tex
            Auxiliar/Latex-Pauta/main.tex
            RP-Modelamiento/Latex/main.tex
            RP-Modelos-Avanzados/Latex/main.tex
          work_in_root_file_dir: true
          # Compilar el resto aunque falle uno; la verificación final falla el job.
          continue_on_error: true

      - name: Verify expected PDFs were generated
        run: |
          set -euo pipefail

          EXPECTED_PDFS=(
            "Apunte/Latex/main.pdf"
            "Auxiliar/Latex-Enunciado/main.pdf"
            "Auxiliar/Latex-Pauta/main.pdf"
            "RP-Modelamiento/Latex/main.pdf"
            "RP-Modelos-Avanzados/Latex/main.pdf"
          )

          missing=0
          echo "Verificando PDFs generados..."
          for pdf in "${EXPECTED_PDFS[@]}"; do
            if [[ -f "${pdf}" ]]; then
              size="$(wc -c < "${pdf}" | tr -d ' ')"
              echo "OK  ${pdf} (${size} bytes)"
            else
              echo "::error file=${pdf}::Fallo la generación de ${pdf}"
              missing=1
            fi
          done

          if [[ "${missing}" -ne 0 ]]; then
            echo "Uno o más PDFs no se generaron. Revisa los logs de Compilación LaTeX."
            exit 1
          fi

          echo "Todos los PDFs esperados están presentes."

      - name: Stage PDFs preserving directory structure
        run: |
          set -euo pipefail

          EXPECTED_PDFS=(
            "Apunte/Latex/main.pdf"
            "Auxiliar/Latex-Enunciado/main.pdf"
            "Auxiliar/Latex-Pauta/main.pdf"
            "RP-Modelamiento/Latex/main.pdf"
            "RP-Modelos-Avanzados/Latex/main.pdf"
          )

          rm -rf pdf-staging
          mkdir -p pdf-staging

          for pdf in "${EXPECTED_PDFS[@]}"; do
            mkdir -p "pdf-staging/$(dirname "${pdf}")"
            cp "${pdf}" "pdf-staging/${pdf}"
            echo "Copiado -> pdf-staging/${pdf}"
          done

          echo "Contenido de pdf-staging:"
          find pdf-staging -type f -name '*.pdf' | sort

      - name: Publish PDFs to pdf-output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ github.token }}
          publish_dir: ./pdf-staging
          publish_branch: pdf-output
          force_orphan: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: "Publish compiled LaTeX PDFs from ${{ github.sha }}"
